plugins {
	id 'java-library'
    id 'maven-publish'
    id 'signing'
	id 'org.springframework.boot' version '3.4.0' apply false
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.github.nabil-carel'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
    withSourcesJar()
    withJavadocJar()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.0"
    }
}

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-webflux'


    compileOnly 'org.projectlombok:lombok'
    compileOnly 'org.springframework.boot:spring-boot-actuator'
    compileOnly 'org.springframework.security:spring-security-web'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
}

test {
	useJUnitPlatform()
}

tasks.named('compileJava') {
    inputs.files(tasks.named('processResources'))
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = 'Composite Spring Boot Starter'
                description = 'Spring Boot starter for batching dependent REST calls into one composite request'
                url = 'https://github.com/Nabil-Carel/composite'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'Nabil-Carel'
                        name = 'Nabil Gbaguidi'
                        url = 'https://github.com/Nabil-Carel'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/Nabil-Carel/composite.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Nabil-Carel/composite.git'
                    url = 'https://github.com/Nabil-Carel/composite'
                }
            }
        }
    }
}

// Provide signingKey and signingPassword as Gradle properties or ORG_GRADLE_PROJECT_* variables.
signing {
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')

    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}
