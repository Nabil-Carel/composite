version: 2

updates:
  # Library dependencies, Gradle plugins and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # The Boot plugin and the Boot BOM must move together.
      spring-boot:
        patterns:
          - org.springframework.boot*
          - io.spring.dependency-management*
        update-types:
          - minor
          - patch
      # Everything else that is not a major upgrade, in one PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Major upgrades still arrive, one PR each, so they can be reviewed on their own.
    ignore:
      # Dependabot proposes only the newest version, so without this a Boot major release hides
      # every 3.x patch. Moving to Boot 4 is a migration done by hand, plugin and BOM together.
      - dependency-name: org.springframework.boot*
        update-types: [version-update:semver-major]

  # Versions of the actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
