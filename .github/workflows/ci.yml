name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: sh ./gradlew check javadoc jacocoTestReport -PtestJavaVersion=${{ matrix.java }} --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            build/reports/tests
            build/reports/jacoco
          if-no-files-found: ignore
