name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    # Every CI job must pass before anything is released.
    uses: ./.github/workflows/ci.yml
    with:
      jcstress-mode: default

  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the project version
        run: |
          version=$(sed -nE "s/^version = '([^']+)'/\1/p" build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match build.gradle version $version" >&2
            exit 1
          fi

      - name: Build and sign artifacts
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal --console=plain
          if [ -z "$ORG_GRADLE_PROJECT_signingKey" ]; then
            echo "::warning::SIGNING_KEY is not set, so the artifacts are unsigned."
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find "$HOME/.m2/repository/io/github/nabil-carel" -type f \
            \( -name '*.jar' -o -name '*.pom' -o -name '*.module' -o -name '*.asc' \))
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
